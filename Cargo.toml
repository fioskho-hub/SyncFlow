[workspace]
members = [
    "crates/core",
    "crates/crypto",
    "crates/storage",
    "crates/sync",
    "examples",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
syncflow-core = { path = "crates/core" }
syncflow-storage = { path = "crates/storage" }
syncflow-sync = { path = "crates/sync" }
tokio = { version = "1.38", features = ["full"] }